# docker-compose.yml
name: voice-agent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['python', 'main.py']
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: '1'
      # Optional explicit binds (your code already defaults WS_HOST/WS_PORT/WS_PATH)
      # WS_HOST: "0.0.0.0"
      # WS_PORT: "5000"
      # WS_PATH: "/twilio"
    ports:
      - '80:5000' # expose public :80 -> container :5000
    restart: unless-stopped
    volumes:
      - ./:/app:rw
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5000/']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional: a static file server for index.html at http://5.161.47.209:8000/
  http:
    image: python:3.13-slim
    working_dir: /app
    command: ['python', '-m', 'http.server', '8000', '--directory', '/app']
    ports:
      - '8000:8000'
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./:/app:ro
